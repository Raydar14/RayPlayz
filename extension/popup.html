<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">RAY · CAPTURE</div>
    <span class="head-tools">
      <a id="popoutLink"  href="#" title="Open in a full tab — popup won't close on blur">⧉</a>
      <a id="settingsLink" href="#" title="Open settings">⚙</a>
    </span>
  </div>

  <div id="statusStrip" class="strip"></div>

  <!-- Mode tabs -->
  <div class="tabs">
    <button type="button" class="tab on" data-mode="screenshot">📷 Screenshot (auto)</button>
    <button type="button" class="tab"    data-mode="paste">Paste text</button>
  </div>

  <!-- SCREENSHOT MODE -->
  <div id="mode-screenshot" class="mode">
    <div class="row" style="grid-template-columns:1fr; margin-bottom:8px">
      <button id="captureTabBtn" class="primary" type="button">📸 Capture this tab</button>
    </div>
    <div id="dropZone" class="drop-zone">
      <div class="drop-inner">
        <div class="drop-title">or drop a screenshot here</div>
        <div class="drop-sub">click to select · paste with Ctrl+V · or use the button above</div>
      </div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </div>
    <div id="thumbWrap" hidden style="text-align:center; margin-top:8px">
      <img id="thumb" style="max-width:100%; max-height:180px; border-radius:6px; border:1px solid var(--stroke)">
      <div style="margin-top:6px; font-size:.72rem; color:var(--mute)"><span id="thumbInfo"></span> · <a href="#" id="clearThumb" style="color:var(--neon-soft)">clear</a></div>
    </div>
    <div class="row">
      <label>Source hint <span class="opt">(optional)</span>
        <select id="imgSource">
          <option value="">auto-detect</option>
          <option value="ig">Instagram</option>
          <option value="tinder">Tinder</option>
          <option value="bumble">Bumble</option>
          <option value="fetlife">Fetlife</option>
          <option value="tiktok">TikTok</option>
          <option value="x">X (Twitter)</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </label>
      <label>Bucket
        <select id="imgBucket">
          <option value="dating">Dating</option>
          <option value="fan">Fan</option>
        </select>
      </label>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button id="captureImgBtn" class="primary" type="button" disabled>Extract &amp; capture</button>
    </div>
  </div>

  <!-- PASTE-TEXT MODE -->
  <div id="mode-paste" class="mode" hidden>
  <div class="row">
    <label>Source
      <select id="source">
        <option value="ig">Instagram</option>
        <option value="tinder">Tinder</option>
        <option value="bumble">Bumble</option>
        <option value="fetlife">Fetlife</option>
        <option value="tiktok">TikTok</option>
        <option value="x">X (Twitter)</option>
        <option value="whatsapp">WhatsApp</option>
      </select>
    </label>
    <label>His handle
      <input type="text" id="handle" placeholder="@handle or username" autocomplete="off">
    </label>
  </div>

  <div class="row">
    <label>Bucket
      <select id="bucket">
        <option value="dating">Dating</option>
        <option value="fan">Fan</option>
      </select>
    </label>
    <label>Display name <span class="opt">(optional)</span>
      <input type="text" id="displayName" placeholder="defaults to handle" autocomplete="off">
    </label>
  </div>

  <label>Parse mode
    <select id="mode">
      <option value="prefix">Prefix mode — lines starting with &gt; are from him</option>
      <option value="alt-his">Alternating — his message first</option>
      <option value="alt-mine">Alternating — my message first</option>
    </select>
  </label>

  <label>Paste the thread here
    <textarea id="transcript" rows="10"
              placeholder="&gt; hey saw you like hiking, know any trails near tamarindo?
haha depends what kind — sunrise or all-day?
&gt; sunrise ideally
noted. i'm testing you though, tell me one thing you're actively working on that has nothing to do with a partner"></textarea>
  </label>

  <div class="row" style="justify-content:space-between; align-items:center">
    <div id="preview" class="preview"></div>
    <button id="captureBtn" class="primary" type="button">Capture</button>
  </div>

  </div><!-- /mode-paste -->

  <div id="result" class="result" hidden></div>
</div>
<script src="popup.js"></script>
</body>
</html>
